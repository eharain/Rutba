name: Auto Merge PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (vars.AUTO_MERGE_ALLOWED_USER || 'eharain') == github.actor ||
        (vars.AUTO_MERGE_ALLOWED_USER || 'eharain') == format('@{0}', github.actor)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Disable auto-merge for draft PRs
        if: github.event.action == 'converted_to_draft' && github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --disable-auto --repo "${{ github.repository }}" || true

      - name: Enable auto-merge (squash)
        if: github.event.pull_request.draft == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --repo "${{ github.repository }}"
