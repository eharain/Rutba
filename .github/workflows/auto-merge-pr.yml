name: Auto Merge PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check allowed actor
        id: actor
        env:
          AUTO_MERGE_ALLOWED_USER: ${{ vars.AUTO_MERGE_ALLOWED_USER }}
        run: |
          set -euo pipefail
          allowed="${AUTO_MERGE_ALLOWED_USER:-eharain}"
          allowed="${allowed#@}"
          actor="${GITHUB_ACTOR#@}"

          if [[ "${actor}" != "${allowed}" ]]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge (squash)
        if: steps.actor.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --repo "${{ github.repository }}"
