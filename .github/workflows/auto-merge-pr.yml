name: Auto Merge PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

env:
  AUTO_MERGE_ALLOWED_USER_NORMALIZED: ${{ vars.AUTO_MERGE_ALLOWED_USER != '' && vars.AUTO_MERGE_ALLOWED_USER || 'eharain' }}

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Disable auto-merge for draft PRs
        if: github.event.action == 'converted_to_draft' && github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(gh pr merge "${{ github.event.pull_request.number }}" --disable-auto --repo "${{ github.repository }}" 2>&1)
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            echo "$output"
            if echo "$output" | grep -Eqi "not enabled|already disabled|already.*disabled|auto-merge.*disabled"; then
              echo "Auto-merge was already disabled; continuing."
            else
              exit $status
            fi
          fi

      - name: Enable auto-merge (squash)
        if: >-
          github.event.pull_request.draft == false &&
          (
            env.AUTO_MERGE_ALLOWED_USER_NORMALIZED == github.actor ||
            env.AUTO_MERGE_ALLOWED_USER_NORMALIZED == format('@{0}', github.actor)
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --repo "${{ github.repository }}"
