name: Auto Merge PR

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.action == 'converted_to_draft' ||
        (vars.AUTO_MERGE_ALLOWED_USER != '' && vars.AUTO_MERGE_ALLOWED_USER || 'eharain') == github.actor ||
        (vars.AUTO_MERGE_ALLOWED_USER != '' && vars.AUTO_MERGE_ALLOWED_USER || 'eharain') == format('@{0}', github.actor)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Disable auto-merge for draft PRs
        if: github.event.action == 'converted_to_draft' && github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          output=$(gh pr merge "${{ github.event.pull_request.number }}" --disable-auto --repo "${{ github.repository }}" 2>&1)
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            echo "$output"
            echo "$output" | grep -qi "not enabled" || exit $status
          fi

      - name: Enable auto-merge (squash)
        if: >-
          github.event.pull_request.draft == false &&
          (
            (vars.AUTO_MERGE_ALLOWED_USER != '' && vars.AUTO_MERGE_ALLOWED_USER || 'eharain') == github.actor ||
            (vars.AUTO_MERGE_ALLOWED_USER != '' && vars.AUTO_MERGE_ALLOWED_USER || 'eharain') == format('@{0}', github.actor)
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ github.event.pull_request.number }}" --auto --squash --repo "${{ github.repository }}"
